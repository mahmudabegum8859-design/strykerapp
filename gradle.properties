# Memory-safe defaults: the sandbox/preview containers have a 2 GiB cgroup RAM cap,
# so the Gradle JVM, Kotlin daemon and clang must fit together (see scripts/*.sh).
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.enableJetifier=true
org.gradle.unsafe.configuration-cache-problems=warn
org.gradle.unsafe.configuration-cache=true
android.nonTransitiveRClass=false
android.defaults.buildfeatures.buildconfig=true
